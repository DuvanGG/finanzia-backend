plugins {
    id 'org.springframework.boot'
}

dependencies {
    // Conecta todos los módulos
    implementation project(':finanzia-api')
    implementation project(':finanzia-infrastructure')
    implementation project(':finanzia-domain')

    // Starters que la app compila directamente (los módulos los exponen solo en runtime)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // Actuator para métricas y health checks (buena práctica)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Flyway (migraciones de la base de datos)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    
    // H2 Database para desarrollo local rápido (opcional, pero recomendado)
    runtimeOnly 'com.h2database:h2:2.3.232'

    // Testcontainers para el test end-to-end (Postgres + Redis + LocalStack)
    testImplementation 'org.testcontainers:testcontainers:1.20.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.3'
    testImplementation 'org.testcontainers:postgresql:1.20.3'
    testImplementation 'org.testcontainers:localstack:1.20.3'
}

tasks.named('test') {
    // Docker Engine moderno exige API >= 1.40; docker-java 1.20.3 negocia por defecto 1.32.
    systemProperty 'api.version', '1.44'
    environment 'DOCKER_API_VERSION', '1.44'
}

springBoot {
    mainClass = 'com.finanzia.FinanziaApplication'
}

// Configuración del JAR ejecutable
bootJar {
    archiveBaseName = 'finanzia'
    archiveVersion = project.version
}

// Desactivamos el JAR plano, solo queremos el bootJar
jar {
    enabled = false
}
